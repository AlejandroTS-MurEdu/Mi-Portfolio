<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animacion - Sistema Solar</title>

    <!-- Vendor CSS -->
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="assets/css/main.css" />
</head>

<body class="solar-page">
    <div class="universe">
        <!-- ESTRELLAS -->
        <div class="stars"></div>
        <div class="stars stars2"></div>
        <div class="stars stars3"></div>

        <!-- SOL -->
        <div class="sun"></div>

        <!-- MERCURIO -->
        <div class="orbit orbit-mercury">
            <div class="planet mercury"></div>
        </div>

        <!-- VENUS -->
        <div class="orbit orbit-venus">
            <div class="planet venus"></div>
        </div>

        <!-- TIERRA -->
        <div class="orbit orbit-earth">
            <div class="planet earth"></div>
        </div>

        <!-- MARTE -->
        <div class="orbit orbit-mars">
            <div class="planet mars"></div>
        </div>

        <!-- JÚPITER -->
        <div class="orbit orbit-jupiter">
            <div class="planet jupiter"></div>
        </div>

        <!-- SATURNO -->
        <div class="orbit orbit-saturn">
            <div class="planet saturn">
                <div class="ring"></div>
            </div>
        </div>

        <!-- URANO -->
        <div class="orbit orbit-uranus">
            <div class="planet uranus"></div>
        </div>

        <!-- NEPTUNO -->
        <div class="orbit orbit-neptune">
            <div class="planet neptune"></div>
        </div>

        <!-- COMETA -->
        <div class="comet-wrapper">
            <div class="comet">
                <div class="comet-core"></div>
                <div class="comet-tail"></div>
                <div class="comet-particles"></div>
            </div>
        </div>
    </div>
</body>

</html>
